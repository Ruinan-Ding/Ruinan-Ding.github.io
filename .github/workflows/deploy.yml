name: Deploy Write Timer to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  # only contents:write is actually exercised — the deploy step below
  # pushes straight to the gh-pages branch via peaceiris/actions-gh-pages,
  # not the OIDC-based actions/deploy-pages flow that pages:write/
  # id-token:write are for
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      # The counting and capping rules, which are the one piece of this app
      # that is logic rather than layout. The browser suites in tests/ cover
      # the rest and are not run here: they need a headless Chrome and a
      # server, and they take minutes rather than seconds. Run them locally
      # with `pnpm run test:ui`.
      - name: Run checks
        run: pnpm test

      - name: Build React app
        run: pnpm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ruinan-ding.com
