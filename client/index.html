<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Write Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%23000000' width='64' height='64'/></svg>" />
    <style>
      * {
        font-family: 'IBM Plex Mono', monospace;
      }
    </style>
    <!-- Theme before first paint. Timer.tsx sets this same attribute in a
         layout effect, but that can't run until React has mounted, so a
         light-theme user got a full dark page first and then a flash to
         light. Only 'light' needs setting: with no attribute at all the
         :root defaults in index.css are already the dark pair.
         'timerLightTheme' is STORAGE_KEYS.lightTheme — the one place in
         the app that key is spelled out twice, noted in constants.ts. -->
    <script>
      try {
        if (localStorage.getItem('timerLightTheme') === 'true') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {
        /* storage blocked: the dark default stands, same as any first visit */
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
