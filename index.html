<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping it blocks pinch-zoom on Android, which
         is an accessibility failure and buys nothing here. Every size in
         the app is a clamp that reflows on its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write Timer</title>
    <meta
      name="description"
      content="A countdown timer that keeps counting past zero, with presets, run history, a wall clock, and a word counter for timed writing sessions." />
    <!-- The share card. Absolute URLs because a scraper resolves nothing
         relative, and og:image is the one asset on this page that is a real
         file rather than a data URI: client/public/og.png, which is why that
         folder exists. Twitter falls back to the og: pair when the
         twitter:-prefixed ones are missing, so only the card type is worth
         restating. No theme-color here: it follows the theme, which is a
         stored setting rather than a fact about the document, so Timer.tsx
         writes it from the same CSS variable everything else reads. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ruinan-ding.com/" />
    <meta property="og:title" content="Write Timer" />
    <meta property="og:description" content="A countdown timer that keeps counting past zero, with presets, run history, a wall clock, and a word counter for timed writing sessions." />
    <meta property="og:image" content="https://ruinan-ding.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Write Timer, its countdown reading -00:01:23 in green on black." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%23000000' width='64' height='64'/></svg>" />
    <style>
      * {
        font-family: 'IBM Plex Mono', monospace;
      }
    </style>
    <!-- Theme before first paint. Timer.tsx sets the same attribute in a
         layout effect, but that can't run until React mounts, so a
         light-theme user got a dark page first and then a flash. Only
         'light' needs setting: with no attribute the :root defaults in
         index.css are already the dark pair.
         'timerLightTheme' is STORAGE_KEYS.lightTheme, the one key spelled
         out in two places; constants.ts notes it. -->
    <script>
      try {
        if (localStorage.getItem('timerLightTheme') === 'true') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {
        /* storage blocked: the dark default stands, same as any first visit */
      }
    </script>
    <script type="module" crossorigin src="/assets/index-Dyk-IiWm.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DCORrsrf.css">
  </head>

  <body>
    <div id="root"></div>
  </body>

</html>
